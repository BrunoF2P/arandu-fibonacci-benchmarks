# Arandu package manifest
schema = 1

[package]
name = "s2_arandu"
version = "0.0.1"
edition = "2026"

[toolchain]
arandu = ">=0.1.0-rc.4, <0.2.0"

[targets.bin]
name = "s2_arandu"
root = "src/main.aru"

[dependencies]

# Reserved policy surface. A2 will infer effects; empty capabilities deny authority.
[capabilities]
network = []
filesystem_read = []
filesystem_write = []
environment = []
process = []
foreign = true

[policy.effects]
deny_new_authority = true
warn_new_resources = true
deny = ["UnknownCapability"]
